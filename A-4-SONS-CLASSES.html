sentence: 'Ali has eaten an apple'?",options:["Present Perfect","Past Simple","Future Simple","Present Continuous"],correct:0},{q:"What is the main function of an adjective?",options:["To describe a noun or pronoun","To show an action","To show a place","To ask a question"],correct:0},{q:"Choose the correct passive form: 'The book ___ by Adil.'",options:["was written","writes","writing","write"],correct:0}],comm:[{q:"What is the most important quality of a good listener?",options:["Listening attentively without interrupting","Shouting loudly","Looking at the phone","Sleeping"],correct:0},{q:"Why do we write a subject line in an email?",options:["To tell the reader what the email is about","For decoration","For fun","It is not needed"],correct:0},{q:"What does 'body language' mean?",options:["Communicating through gestures and expressions without words","Singing a song","Running fast","Sleeping"],correct:0},{q:"What is the best way to end a conflict?",options:["Calm discussion, apology and finding a solution","Increasing the fight","Staying silent forever","Crying"],correct:0}],lang:[{q:"What is a synonym of 'Happy'?",options:["Joyful","Sad","Angry","Tired"],correct:0},{q:"What does the idiom 'Break the ice' mean?",options:["To start a conversation and remove awkwardness","To literally break ice","To spill water","To feel cold"],correct:0},{q:"What is the difference between 'Their', 'There' and 'They're'?",options:["Possession, place, and contraction of 'They are'","They are all the same","There is no difference","It is a spelling mistake"],correct:0},{q:"What should you avoid in a formal letter?",options:["Slang and emojis","Date","Subject line","Polite ending"],correct:0}],scientist:[{q:"What did Einstein explain about Time and Space?",options:["Time and Space are connected and bend with gravity - Theory of Relativity","Time never ends","Space is empty","Time is only a clock"],correct:0},{q:"What did Newton learn from the falling apple?",options:["Gravity - Earth pulls everything towards it","Apple has magic","Wind pushes apple","Apple is not heavy"],correct:0},{q:"How many times did Edison fail before making the bulb?",options:["More than 1000 times - Never give up","Made it in first try","Never failed","Someone else made it"],correct:0},{q:"What did Marie Curie discover?",options:["Radioactivity and two elements Radium and Polonium","Bulb","Gravity","Mobile phone"],correct:0}]},vr=[{id:"einstein",name:"Albert Einstein",nameRoman:"Albert Einstein",field:"Physics",year:"1879-1955",emoji:"\uD83E\uDDE0",workRoman:"Time aur Space ek hain - Relativity Theory",lessonRoman:"Sawal puchte raho, imagination knowledge se zyada zaroori hai",workEnglish:"Theory of Relativity - Time and Space are connected",lessonEnglish:"Keep asking questions, imagination is more important than knowledge",introRoman:"Einstein duniya ka sabse mashhoor scientist tha. Usne bataya ke Time aur Space alag nahi, ek hi cheez hain. Bhaari cheez jaise Suraj Space ko mor deta hai, isi ko Gravity kehte hain. Usne kaha har cheez roshni ki raftar se tez nahi ja sakti.",introEnglish:"Albert Einstein was the most famous scientist. He proved Time and Space are one fabric. Heavy objects like Sun bend Space, that bending is Gravity. Nothing can go faster than light. He loved curiosity."},{id:"newton",name:"Isaac Newton",nameRoman:"Isaac Newton",field:"Physics & Maths",year:"1643-1727",emoji:"\uD83C\uDF4E",workRoman:"Gravity ka qanoon - Seb kyun girta hai",lessonRoman:"Choti cheez ko ghor se dekho, bada raaz milega",workEnglish:"Laws of Motion and Universal Gravitation",lessonEnglish:"Observe small things carefully, you will find big secrets",introRoman:"Newton bagh me betha tha, seb gira to usne socha - seb upar kyun nahi jata? Neeche kyun girta hai? Usne samjha Zameen me kashish hai jo har cheez ko kheenchti hai. Isi kashish ko Gravity kehte hain. Usne 3 qanoon banaye jo aaj bhi rocket urane me kaam aate hain.",introEnglish:"Newton was sitting in garden when apple fell. He asked why apple falls down not up. He discovered Gravity - Earth pulls everything. His 3 laws of motion still help us launch rockets."},{id:"edison",name:"Thomas Edison",nameRoman:"Thomas Edison",field:"Inventor",year:"1847-1931",emoji:"\uD83D\uDCA1",workRoman:"Bulb aur 1000+ ijadaat",lessonRoman:"1000 dafa fail hona bhi seekhna hai, haar mat mano",workEnglish:"Light bulb and 1000+ inventions",lessonEnglish:"Failing 1000 times is also learning, never give up",introRoman:"Edison ne bulb banaya magar 1000 dafa fail hua. Log haste the, magar usne kaha maine 1000 tareeqe seekhe jo kaam nahi karte. Aakhir me roshni ka bulb ban gaya aur raat me ujala ho gaya. Usne kaha genius 1% idea aur 99% mehnat hai.",introEnglish:"Edison invented the light bulb after 1000 failures. People laughed but he said I learned 1000 ways that do not work. Finally bulb glowed and night became bright. He said genius is 1% idea and 99% hard work."},{id:"curie",name:"Marie Curie",nameRoman:"Marie Curie",field:"Physics & Chemistry",year:"1867-1934",emoji:"\uD83D\uDD2C",workRoman:"Radioactivity aur Radium ki khoj",lessonRoman:"Mehnat aur lagan se larki bhi Nobel jeet sakti hai",workEnglish:"Discovery of Radioactivity, Radium and Polonium",lessonEnglish:"With hard work a girl can also win Nobel Prize",introRoman:"Marie Curie pehli aurat thi jisne 2 Nobel Prize jeete. Usne aisi kirnen dhoondin jo aankh se nazar nahi aatin - Radioactivity. Usne Radium aur Polonium naam ke 2 naye elements dhoonde. Aaj cancer ka ilaj isi khoj se hota hai.",introEnglish:"Marie Curie was first woman to win 2 Nobel Prizes. She discovered invisible rays called Radioactivity. She found two new elements Radium and Polonium. Today cancer treatment uses her discovery."},{id:"aqkhan",name:"Dr. Abdul Qadeer Khan",nameRoman:"Dr. Abdul Qadeer Khan",field:"Nuclear Science",year:"1936-2021",emoji:"\uD83C\uDDF5\uD83C\uDDF0",workRoman:"Pakistan ke liye Nuclear Technology",lessonRoman:"Apne mulk ke liye ilm istemal karo",workEnglish:"Made Pakistan nuclear power for safety",lessonEnglish:"Use your knowledge for your country",introRoman:"Dr. Abdul Qadeer Khan Pakistan ke mohsin hain. Unhone Pakistan ko Nuclear taqat banaya taa ke koi hamla na kar sake. Wo kehte the taleem hasil karo aur apne mulk ko mazboot banao. Unki mehnat se Pakistan mehfooz hua.",introEnglish:"Dr. A Q Khan is hero of Pakistan. He made Pakistan a nuclear power so no one can attack us. He said get education and make your country strong. Because of him Pakistan is safe."},{id:"ibnsina",name:"Ibn Sina",nameRoman:"Ibn Sina (Bu Ali Sina)",field:"Medicine",year:"980-1037",emoji:"\uD83E\uDE7A",workRoman:"Pehli medical kitaab - Al Qanoon",lessonRoman:"Kitab likhna aur ilm baantna sabse badi khidmat hai",workEnglish:"First medical encyclopedia Al-Qanoon",lessonEnglish:"Writing books and sharing knowledge is best service",introRoman:"Ibn Sina 1000 saal pehle ke doctor the. Unhone Al-Qanoon naam ki kitaab likhi jo 600 saal tak Europe me parhai jati rahi. Unhone bataya ke bemari kaise hoti hai aur dawa kaise kaam karti hai. Wo kehte the sehat sabse badi nemat hai.",introEnglish:"Ibn Sina was a doctor 1000 years ago. He wrote Al-Qanoon medical book taught in Europe for 600 years. He explained how diseases happen and how medicines work. He said health is biggest wealth."},{id:"khwarizmi",name:"Al-Khwarizmi",nameRoman:"Al-Khwarizmi",field:"Mathematics",year:"780-850",emoji:"\uD83D\uDD22",workRoman:"Zero (0) aur Algebra ka baani",lessonRoman:"Numbers se poori duniya chalti hai",workEnglish:"Invented Algebra and introduced Zero",lessonEnglish:"Whole world runs on numbers",introRoman:"Al-Khwarizmi Muslim scientist tha jisne Zero (0) ka concept diya aur Algebra banaya. Aaj mobile, computer, bank sab usi ke numbers se chalte hain. Algorithm lafz bhi usi ke naam se bana hai. Baghair uske science aage nahi barh sakti thi.",introEnglish:"Al-Khwarizmi was Muslim mathematician who invented Zero and Algebra. Today mobile, computer, banks all run on his numbers. Word Algorithm comes from his name. Without him science could not progress."},{id:"hawking",name:"Stephen Hawking",nameRoman:"Stephen Hawking",field:"Cosmology",year:"1942-2018",emoji:"\uD83C\uDF0C",workRoman:"Black Hole kya hai",lessonRoman:"Wheelchair par bhi soch se kainat samjhi ja sakti hai",workEnglish:"Black Holes emit radiation - Hawking Radiation",lessonEnglish:"Even on wheelchair you can understand universe with thinking",introRoman:"Stephen Hawking wheelchair par tha, bol bhi nahi sakta tha magar dimagh se poori kainat samajh li. Usne bataya Black Hole kaala garha hai jo roshni ko bhi nigal jata hai, magar usme se bhi thodi roshni nikalti hai. Usne kaha himmat kabhi mat haro.",introEnglish:"Stephen Hawking was on wheelchair, could not speak but understood whole universe. He said Black Hole is dark pit that swallows light, but some light escapes. He said never lose hope."},{id:"darwin",name:"Charles Darwin",nameRoman:"Charles Darwin",field:"Biology",year:"1809-1882",emoji:"\uD83E\uDD81",workRoman:"Evolution - Jandar kaise badalte hain",lessonRoman:"Ghor karo, saboot dhoondo, phir faisla karo",workEnglish:"Theory of Evolution - Species change over time",lessonEnglish:"Observe, find evidence, then decide",introRoman:"Darwin ne dekha ke janwar waqt ke saath badalte hain taa ke zinda reh saken. Jaise jiraf ki gardan lambi hui taa ke unche patte kha sake. Usne 20 saal tak saboot jama kiye phir kitaab likhi. Sikhata hai ke jaldi faisla mat karo.",introEnglish:"Darwin saw animals change over time to survive. Like giraffe neck became long to eat tall leaves. He collected evidence for 20 years then wrote book. Teaches not to decide quickly."},{id:"tesla",name:"Nikola Tesla",nameRoman:"Nikola Tesla",field:"Electrical",year:"1856-1943",emoji:"⚡",workRoman:"AC Current - Ghar me bijli kaise aati hai",lessonRoman:"Naya socho, duniya badal jayegi",workEnglish:"AC electricity that powers our homes",lessonEnglish:"Think new, world will change",introRoman:"Tesla ne AC bijli banayi jo aaj hamare gharon me aati hai. Edison DC bijli deta tha jo door nahi ja sakti thi. Tesla ne socha bijli ko door tak kaise bheja jaye. Aaj usi ki wajah se bulb jalte hain. Wo kehta tha future mera hai.",introEnglish:"Tesla made AC electricity that powers our homes today. Edison gave DC that could not travel far. Tesla thought how to send electricity far. Today bulbs glow because of him. He said future is mine."},{id:"galileo",name:"Galileo Galilei",nameRoman:"Galileo Galilei",field:"Astronomy",year:"1564-1642",emoji:"\uD83D\uDD2D",workRoman:"Telescope se chaand sitaare dekhe",lessonRoman:"Ankh se dekho aur sach bolo chahe log naraz hon",workEnglish:"Improved telescope, saw moons of Jupiter",lessonEnglish:"See with eyes and speak truth even if people get angry",introRoman:"Galileo ne doorbeen behtar banayi aur dekha ke chaand gol nahi, us par pahad hain. Usne dekha Jupiter ke 4 chaand hain. Log kehte the Zameen markaz hai, usne kaha Suraj markaz hai. Sach bolne par usko saza mili magar sach jeeta.",introEnglish:"Galileo improved telescope and saw Moon has mountains, not smooth. Saw Jupiter has 4 moons. People said Earth is center, he said Sun is center. He was punished for truth but truth won."},{id:"wbrothers",name:"Wright Brothers",nameRoman:"Wright Brothers",field:"Aviation",year:"1871-1948",emoji:"✈️",workRoman:"Pehla hawai jahaaz",lessonRoman:"Khwab dekho aur mehnat se udaan bharo",workEnglish:"First airplane that flew",lessonEnglish:"Dream and work hard to fly",introRoman:"Wright Brothers cycle mechanic the. Unhone socha insan bhi parinde ki tarah ur sakta hai. 4 saal koshish ki, kai dafa gire, magar 1903 me pehli baar 12 second ke liye hawa me ude. Aaj ham ghanton me mulkon me jaate hain.",introEnglish:"Wright Brothers were cycle mechanics. They thought humans can also fly like birds. Tried 4 years, fell many times, but in 1903 flew for 12 seconds. Today we fly across countries in hours."},{id:"graham",name:"Alexander Graham Bell",nameRoman:"Alexander Graham Bell",field:"Communication",year:"1847-1922",emoji:"\uD83D\uDCDE",workRoman:"Telephone ki ijad",lessonRoman:"Door rehne walon ko qareeb lao",workEnglish:"Invented telephone",lessonEnglish:"Bring far people close",introRoman:"Graham Bell ne telephone banaya taa ke door ki awaz suni ja sake. Pehla jumla tha - Mr. Watson, come here. Aaj usi telephone se mobile bana. Wo kehta tha jab ek darwaza band hota hai to dusra khulta hai.",introEnglish:"Graham Bell invented telephone so far voices can be heard. First sentence was Mr. Watson come here. From that telephone mobile was made. He said when one door closes another opens."},{id:"curie2",name:"Ibn Al-Haytham",nameRoman:"Ibn Al-Haytham",field:"Optics",year:"965-1040",emoji:"\uD83D\uDC41️",workRoman:"Aankh kaise dekhti hai - Camera ka baap",lessonRoman:"Roshni ko samjho, tasveer ban jayegi",workEnglish:"How eye sees - Father of camera",lessonEnglish:"Understand light, picture will form",introRoman:"Ibn Al-Haytham ne bataya ke aankh se roshni nahi nikalti, bahar se roshni aankh me aati hai tab nazar aata hai. Usne pehla camera obscura banaya. Aaj ka har camera usi ke usool par chalta hai.",introEnglish:"Ibn Al-Haytham explained light does not come from eye, outside light enters eye then we see. He made first camera obscura. Today every camera works on his principle."},{id:"pasteur",name:"Louis Pasteur",nameRoman:"Louis Pasteur",field:"Biology",year:"1822-1895",emoji:"\uD83E\uDDEB",workRoman:"Vaccine aur doodh ko saaf rakhna",lessonRoman:"Safai se bemari khatam hoti hai",workEnglish:"Vaccines and pasteurization",lessonEnglish:"Cleanliness ends disease",introRoman:"Pasteur ne bataya ke bemari chote keeton - germs se hoti hai. Usne vaccine banayi jo jism ko bemari se ladna sikhati hai. Doodh ko garam kar ke germs marne ka tareeqa bhi usne bataya - Pasteurization.",introEnglish:"Pasteur proved disease comes from small germs. He made vaccines that teach body to fight disease. He also taught heating milk to kill germs - Pasteurization."},{id:"jobs",name:"Steve Jobs (Modern)",nameRoman:"Steve Jobs",field:"Technology",year:"1955-2011",emoji:"\uD83D\uDCBB",workRoman:"iPhone aur computer ko asan banaya",lessonRoman:"Simple aur khoobsurat cheez banao",workEnglish:"Made computers simple - iPhone",lessonEnglish:"Make simple and beautiful things",introRoman:"Steve Jobs ne computer ko asan aur khoobsurat banaya. Usne iPhone banaya jo phone, camera, computer sab hai. Wo kehta tha jo kaam pasand ho wahi karo, warna zindagi zaya ho jayegi.",introEnglish:"Steve Jobs made computers simple and beautiful. He made iPhone which is phone, camera, computer all in one. He said do what you love else life is wasted."},{id:"ada",name:"Ada Lovelace",nameRoman:"Ada Lovelace",field:"Computer",year:"1815-1852",emoji:"\uD83D\uDC69‍\uD83D\uDCBB",workRoman:"Pehli programmer - Computer ka khwab",lessonRoman:"Larkiyan bhi coding kar sakti hain",workEnglish:"First computer programmer",lessonEnglish:"Girls can also code",introRoman:"Ada Lovelace duniya ki pehli programmer thi. 1840 me usne socha machine sirf hisab nahi, tasveer aur music bhi bana sakti hai. Usne pehla algorithm likha. Aaj har coder usi ko yaad karta hai.",introEnglish:"Ada Lovelace was worlds first programmer. In 1840 she thought machine can make not only calculations but also pictures and music. She wrote first algorithm. Today every coder remembers her."},{id:"turing",name:"Alan Turing",nameRoman:"Alan Turing",field:"Computer",year:"1912-1954",emoji:"\uD83E\uDD16",workRoman:"Computer ka dimagh kaise sochta hai",lessonRoman:"Mushkil sawal ka hal logic se nikalo",workEnglish:"Father of Computer Science and AI",lessonEnglish:"Solve hard questions with logic",introRoman:"Alan Turing ne bataya computer kaise soch sakta hai. Dusri jang me usne German code tora aur lakhon jaanen bachain. Usne kaha machine bhi insan ki tarah soch sakti hai - yehi AI ki shuruat thi.",introEnglish:"Alan Turing explained how computer can think. In WW2 he broke German code and saved millions. He said machine can think like human - that was start of AI."},{id:"kalam",name:"Dr. APJ Abdul Kalam",nameRoman:"Dr. APJ Abdul Kalam",field:"Space",year:"1931-2015",emoji:"\uD83D\uDE80",workRoman:"India ka Missile Man aur sadar",lessonRoman:"Chote gaon se bhi bada scientist ban sakta hai",workEnglish:"Missile Man of India, President",lessonEnglish:"Even from small village you can become great scientist",introRoman:"Abdul Kalam chote gaon ke gareeb ghar se the, akhbar bechte the. Mehnat se rocket scientist bane aur sadar bane. Wo bachon se kehte the - Khwab dekho, khwab soch me badlo, aur soch ko amal me.",introEnglish:"Abdul Kalam was from poor village, sold newspapers. By hard work became rocket scientist and President. He told kids - Dream, turn dream into thought, and thought into action."},{id:"farabi",name:"Al-Farabi",nameRoman:"Al-Farabi",field:"Philosophy & Science",year:"872-950",emoji:"\uD83D\uDCD6",workRoman:"Music aur logic ka ustad",lessonRoman:"Ilm ko taqseem karo aur joro",workEnglish:"Teacher of music and logic",lessonEnglish:"Divide and connect knowledge",introRoman:"Al-Farabi ko Second Teacher kehte hain. Usne music, logic, science sab par likha. Usne bataya ke ilm ek darakht ki tarah hai, sab shaakhen juri hui hain. Socho aur seekho.",introEnglish:"Al-Farabi is called Second Teacher. He wrote on music, logic, science. He said knowledge is like tree, all branches connected. Think and learn."}],ih={middle:{eng:[{q:"Past Perfect Tense kis liye istemal hota hai? \uD83E\uDDD0",options:["Mazi se pehle ka kaam jo khatam ho chuka ho","Abhi ho raha kaam","Kal hone wala kaam","Hukam dena"],correct:0},{q:"'Ali has eaten an apple' ye kaunsa tense hai?",options:["Present Perfect","Past Simple","Future","Present Continuous"],correct:0},{q:"Adjective ka kaam kya hai?",options:["Noun ki khoobi batana","Kaam batana","Jaga batana","Sawal karna"],correct:0},{q:"Which sentence is passive? 'The book ___ by Adil.'",options:["was written","writes orrect:0}],emerg:[{q:"Aag lage to kya bolo? \uD83D\uDD25",options:["Ammi! Aag!","Hahaha","Kuch nahi","Maza"],correct:0},{q:"Gir jao to? \uD83E\uDD15",options:["Ammi ko bolo","Chup raho","Bhago","Haso"],correct:0},{q:"Ajnabi toffee de to? \uD83C\uDF6C",options:["Nahi leni, Ammi ko batana","Le leni","Kha leni","Bhag jana"],correct:0},{q:"Police ka number? \uD83D\uDEA8",options:["15","11","1","5"],correct:0}]}},K0={middle:["Einstein kehta tha - 'Imagination is more important than knowledge'. Tum is baat se kya samajhte ho? Apne 5 points Roman Urdu me likho, scientist ki zindagi se misaal do.","Agar tumhe Edison ki tarah 1000 dafa fail hone ke baad bhi koshish karni ho to tum kya karoge? Apna plan 5 jumlo me likho.","Al-Khwarizmi ne Zero (0) banaya. Agar Zero na hota to mobile/computer kaise chalta? Soch ke 4 points likho.","Marie Curie ne kaha mehnat se larki bhi Nobel jeet sakti hai. Tum is se kya sabaq lete ho? 4 jumle likho.","Stephen Hawking wheelchair par tha magar poori kainat samajh li. Himmat ke bare me tum kya sochte ho? Likho.","Agar tum scientist bante to kaunsi cheez ijad karte jo insaniyat ki madad kare? Tafseel se likho - kaam, faida, kaise banoge.","Newton ne seb girte dekh ke Gravity dhoondi. Tum roz ki kaunsi choti cheez me science dekhte ho? 3 misaal likho."],primary:["Agar tum scientist bante to kaunsi cheez banate jo sab ki madad kare? 4 jumle likho - kya banate, kyun, kaise kaam karegi.","Edison ne bulb banaya taa ke raat me roshni ho. Tum roshni se kya kya kaam karte ho? 4 kaam likho.","Einstein kehta tha sawal pucho. Tum din me kaun se 5 sawal puchte ho? Likho.","Wright Brothers ne socha insan ur sakta hai. Tumhara khwab kya hai jo mushkil lagta hai magar tum karna chahte ho? Likho.","Ibn Sina doctor the aur kitaaben likhte the. Tumhe doctor banna pasand hai? Kyun? 3 waja likho.","Numbers kaun banata hai? Al-Khwarizmi ne Zero banaya. Zero ke baghair ginti kaise hoti? Socho aur likho.","Tumhara pasandeeda scientist kaun hai? Uske bare me 4 jumle Roman Urdu me likho."],beginner:["Mujhe kaunsa scientist pasand hai aur kyun? 2 waja likho. Jaise Edison bulb wala.","Me bade ho kar scientist banunga to kya banaunga? 2 cheez likho.","Bulb kisne banaya? Uske bare me 2 jumle likho.","Mujhe hawai jahaaz pasand hai. Kaun urata hai? Likho.","Mera dost kaun hai? Uske sath kaunsi science wali cheez dekhi?","Suraj aur Chaand me farq kya hai? 2 points likho.","Subah uth kar me kaunsa science ka kaam karta hun? Jaise brush, pani peena."]},ah={middle:{english:["Albert Einstein was one of the greatest scientists in history. He was born in Germany in 1879. He was curious since childhood and always asked big questions like what is time, what is space, what is light. He discovered Theory of Relativity which says time and space are connected like a fabric. When a heavy object like Sun sits on this fabric, it bends, and that bending is called gravity. He said nothing can travel faster than light. He loved imagination more than knowledge. He once said imagination is more important than knowledge. His ideas help us understand black holes, GPS, and universe. He failed in school exams but never stopped thinking. Lesson: Keep asking questions and imagine big.","Isaac Newton was sitting in a garden when an apple fell from a tree. He thought why does apple always fall down, never up? He discovered gravity - Earth pulls everything towards it. He made three laws of motion. First law says object stays still unless pushed. Second law says force equals mass times acceleration. Third law says every action has equal opposite reaction. These laws help us launch rockets, build cars, and understand planets. He also studied light and showed white light has seven colours. He was very hardworking and spent years observing. Lesson: Small observation can lead to big discovery if you think deeply.","Al-Khwarizmi was a Muslim mathematician who lived 1200 years ago in Baghdad. He invented the number Zero and the concept of Algebra. Word Algebra comes from his book Al-Jabr. Word Algorithm also comes from his name Al-Khwarizmi. Today every mobile phone, computer, bank, and rocket uses his numbers. Without zero, we cannot count properly. Ibn Sina, another great scientist, wrote Al-Qanoon medical book that was taught for 600 years in Europe. He explained diseases and medicines. These scientists show Muslim contribution to science. Lesson: Share knowledge through books and numbers power the world."],urdu:["Einstein duniya ka sabse mashhoor scientist tha. Wo Germany me 1879 me paida hua. Bachpan se hi sawal puchta tha - Time kya hai? Space kya hai? Roshni kya hai? Usne bataya Time aur Space alag nahi, ek hi kapde ki tarah hain. Jab Suraj jaisi bhaari cheez is kapde par baithti hai to kapda mur jata hai, isi murne ko Gravity kehte hain. Usne kaha koi cheez roshni se tez nahi ja sakti. Wo kehta tha imagination knowledge se zyada zaroori hai. Uske ideas se aaj hum Black Hole, GPS aur kainat ko samajhte hain. Wo school me fail bhi hua magar sochna nahi chora. Sabaq: Sawal puchte raho aur bada socho.","Newton bagh me betha tha ke seb gira. Usne socha seb hamesha neeche kyun girta hai, upar kyun nahi jata? Usne samjha Zameen me kashish hai jo har cheez ko apni taraf kheenchti hai. Isi kashish ka naam Gravity rakha. Usne 3 qanoon banaye. Pehla - Cheez tab tak ruki rahegi jab tak dhakka na lage. Dusra - Taqat = wazan x raftar. Teesra - Har amal ka ulta rad-e-amal hota hai. Ye qanoon aaj rocket urane, gaari banane aur sayyaron ko samajhne me kaam aate hain. Usne bataya safed roshni me 7 rang hote hain. Wo bohat mehnati tha, saalon tak dekhta rehta tha. Sabaq: Choti cheez ko ghor se dekho to badi khoj milti hai.","Al-Khwarizmi 1200 saal pehle Baghdad me rehta tha. Usne Zero (0) ijaad kiya aur Algebra banaya. Algebra lafz uski kitaab Al-Jabr se aaya. Algorithm lafz bhi usi ke naam Al-Khwarizmi se bana hai. Aaj mobile, computer, bank, rocket sab usi ke numbers se chalte hain. Zero ke baghair ginti namumkin hai. Ibn Sina ne Al-Qanoon naam ki medical kitaab likhi jo Europe me 600 saal tak parhai gayi. Unhone bemari aur dawa ke bare me bataya. Ye dono Muslim sciencedan hain jinhone duniya ko roshni di. Sabaq: Ilm ko kitaabon me likh ke baanto, numbers se poori duniya chalti hai."]},primary:{english:["Thomas Edison was a great inventor. He failed more than 1000 times while making the light bulb. People laughed at him but he said I learned 1000 ways that do not work. Finally he made a bulb that glows. Today we have light at night because of him. He made more than 1000 inventions like phonograph and battery. He said genius is 1 percent idea and 99 percent hard work. He loved working in his lab day and night. Lesson: Never give up even if you fail many times.","Ibn Sina was a doctor 1000 years ago. He wrote a big medical book called Al-Qanoon. This book was taught in Europe for 600 years. He explained how diseases happen and how medicines work. He said health is the biggest wealth. He also studied stars and philosophy. He was very kind to patients. He taught us to wash hands and eat clean food. Today doctors still respect him. Lesson: Help people and share knowledge.","Wright Brothers were cycle mechanics. They dreamed that humans can fly like birds. They watched birds, made wings, tried and fell many times. In 1903 they flew first airplane for 12 seconds. People said humans cannot fly but they proved wrong. Today we fly across countries in hours because of them. They worked as a team, brother helped brother. Lesson: Dream big and work as team."],urdu:["Edison bohat bada mojid tha. Usne bulb banane ke liye 1000 dafa koshish ki aur fail hua. Log hanste the magar usne kaha maine 1000 tareeqe seekhe jo kaam nahi karte. Aakhir me bulb jal gaya aur raat me roshni ho gayi. Aaj raat me hum usi ki wajah se parhte hain. Usne 1000 se zyada cheezen banain jaise gaana record karne wali machine. Wo kehta tha genius 1% khayal aur 99% mehnat hai. Wo din raat lab me kaam karta tha. Sabaq: Kabhi haar mat mano, koshish jaari rakho.","Ibn Sina 1000 saal pehle ke hakeem the. Unhone Al-Qanoon naam ki bari kitaab likhi jo Europe me 600 saal tak parhai gayi. Unhone bataya bemari kaise hoti hai aur dawa kaise kaam karti hai. Wo kehte the sehat sabse badi nemat hai. Wo sitaron aur soch ke bare me bhi likhte the. Mareezon se bohat pyaar karte the. Haath dhona aur saaf khana unhi ki naseehat hai. Aaj bhi doctor unki izzat karte hain. Sabaq: Logon ki madad karo aur ilm baanto.","Wright Brothers cycle banate the. Unhone socha insan bhi chirya ki tarah ur sakta hai. Chirya ko dekha, par banaye, gire, phir koshish ki. 1903 me pehli baar 12 second ke liye hawa me ude. Log kehte the insan nahi ur sakta magar unhone ghalat sabit kiya. Aaj hum ghanton me mulkon me jaate hain unhi ki wajah se. Dono bhai mil ke kaam karte the. Sabaq: Bada khwab dekho aur mil jul ke kaam karo."]},beginner:{english:["My name is Aashir. I am 7 years old. I like scientists. Scientist is a person who asks questions and finds new things. Edison made bulb. Wright Brothers made airplane. Al-Khwarizmi made numbers. I want to be scientist. I ask why sky is blue. I like to learn.","This is my home. My home is clean. I have toys. Scientist makes toys also. Computer is made by scientists. Mobile is made by scientists. I use computer to learn. I love science. Science makes life easy.","I like milk. Milk makes me strong. Louis Pasteur said milk should be heated to kill germs. This is called pasteurization. I drink clean milk daily. I wash hands before eating. Scientist says clean hands keep us healthy."],urdu:["Mera naam Aashir hai. Me 7 saal ka hun. Mujhe sciencedan pasand hain. Sciencedan wo hota hai jo sawal puchta hai aur nayi cheezen dhoondta hai. Edison ne bulb banaya. Wright Brothers ne hawai jahaaz banaya. Al-Khwarizmi ne numbers banaye. Me bhi sciencedan banunga. Me puchta hun aasman neela kyun hai. Mujhe seekhna pasand hai.","Ye mera ghar hai. Mera ghar saaf hai. Mere pas khilone hain. Khilone bhi sciencedan banate hain. Computer sciencedan ne banaya. Mobile sciencedan ne banaya. Me computer se seekhta hun. Mujhe science pasand hai. Science se zindagi asan hoti hai.","Mujhe doodh pasand hai. Doodh se taqat aati hai. Louis Pasteur ne kaha doodh ko garam karo taa ke keetanu mar jayen. Isi ko Pasteurization kehte hain. Me roz saaf doodh peeta hun. Khane se pehle haath dhota hun. Sciencedan kehta hai saaf haath sehatmand rakhte hain."]}};function Qa(){let[e,n]=N.useState("adil"),[t,r]=N.useState("mcqs"),[l,u]=N.useState({}),[o,i]=N.useState({}),[p,m]=N.useState(new Set),[g,E]=N.useState({}),[w,z]=N.useState(""),[O,M]=N.useState(!1),[j,h]=N.useState(null),[s,y]=N.useState([]),[_,L]=N.useState(null),[$,R]=N.useState(new Set),[Q,ne]=N.useState(new Set),[T,Ue]=N.useState(!1),[ie,j0]=N.useState(()=>new Date),[to,Va]=N.useState(()=>new Date().toLocaleDateString("en-CA")),[b0,ro]=N.useState(!1),Wa=N.useRef(new Date().toLocaleDateString("en-CA")),[fh,gl]=N.useState(null),[ch,lo]=N.useState(null),[es,mr]=N.useState(new Set),[On,nt]=N.useState(!1),[Mn,tt]=N.useState(!1),[ns,wl]=N.useState(null),[ts,El]=N.useState(null),[ph,uo]=N.useState(null),[Qe,_l]=N.useState(null),[Ve,kl]=N.useState(null),[je,oo]=N.useState(null),[sh,Nl]=N.useState({}),[vh,Pl]=N.useState({}),[io,Ya]=N.useState(!1),[zl,Xa]=N.useState(!1),[Mt,Lt]=N.useState(0),Ln=N.useRef(null),rt=N.useRef(null),Dt=N.useRef([]),lt=N.useRef(null),Za=N.useRef(null),Ta=N.useRef(null),Ga=N.useRef(null),hr=N.useRef(null),[,rs]=N.useState(""),[,ls]=N.useState(""),[,us]=N.useState(""),[dn,yr]=N.useState(null),[ut,ot]=N.useState(!1),[it,Ja]=N.useState(!1),[os,at]=N.useState(!1),[ft,Sl]=N.useState(!1),[Ba,Cl]=N.useState(!1);N.useEffect(()=>{let c=setInterval(()=>{j0(new Date)},60000);return()=>clearInterval(c)},[]),N.useEffect(()=>{try{document.title="A-4 SONS CLASSES"}catch{}},[]),N.useEffect(()=>{let c=(F)=>{if(F.preventDefault(),yr(F),!it&&!ft)ot(!0)},v=()=>{Ja(!0),ot(!1),yr(null),Cl(!1);try{localStorage.removeItem("a4_install_dismissed")}catch{}h("
